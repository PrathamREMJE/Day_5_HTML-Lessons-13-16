<!DOCTYPE html>
<html>
<head>
    <title>13g - Twitter Design</title>
    <link rel="stylesheet" href="styles/13g.css">
</head>
<body>
    <div class="tweet">
        <img class="profile-img" src="../thumbnails/cat.jpg">
        <div class="tweet-content">
            <div class="user-info">
                <span class="username">
                    supersimple.dev
                </span>
                <span class="handle">
                    @SuperSimpleDev
                </span>
            </div>
            <div class="tweet-text">
                What is backend web development? A complete
                overview. New video is up!
            </div>
            <div class="link-preview">
                <div class="thumbnail">
                </div>
                <div class="link-content">
                    <div class="website">
                        youtube.com
                    </div>
                    <div class="video-title">
                        Backend web development - a
                        complete overview (2021)
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
